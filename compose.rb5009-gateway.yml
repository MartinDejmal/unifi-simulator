# RB5009 (RouterOS 7.24.5) as a UniFi gateway: WAN1 = ether1, WAN2 = ether5, plus its ports
# (ether1-8, sfp-sfpplus1) via port_table. Model code is an experiment (MTUNIFI_RB5009_MODEL);
# each model gets its own state volume, i.e. its own identity (forget the old one in UniFi).
# Read-only RouterOS API, own state volume. Only ONE gateway may exist per UniFi site.
# docker compose -f compose.rb5009.yml --env-file .env.rb5009 up -d --build
# Password lives in .secrets/rb5009-password (chmod 644 in a 700 dir), never in .env or here.
services:
  rb5009:
    build: .
    container_name: mtunifi-rb5009
    environment:
      MTUNIFI_INFORM_URL: ${MTUNIFI_INFORM_URL:?Set the controller /inform URL}
      MTUNIFI_DEVICE_IP: ${MTUNIFI_RB5009_IP:?Set the IPv4 address shown for the gateway in UniFi}
      MTUNIFI_HOSTNAME: ${MTUNIFI_RB5009_HOSTNAME:-mtunifi-rb5009}
      MTUNIFI_HOSTNAME_FROM_IDENTITY: "true"
      MTUNIFI_PROFILE: rb5009-gateway-experimental
      MTUNIFI_DEVICE_MODEL: ${MTUNIFI_RB5009_MODEL:-UGWXG}
      MTUNIFI_ROUTEROS_MAP_FILE: /scenarios/routeros-rb5009.json
      MTUNIFI_TELEMETRY_SOURCE: routeros
      MTUNIFI_ROUTEROS_HOST: ${MTUNIFI_RB5009_HOST:?Set the RouterOS address}
      MTUNIFI_ROUTEROS_PORT: 8728
      # Plaintext API on the LAN by explicit choice; no TLS fallback exists.
      MTUNIFI_ROUTEROS_TLS: "false"
      MTUNIFI_ROUTEROS_USER: ${MTUNIFI_RB5009_USER:?Set the read-only API user}
      MTUNIFI_ROUTEROS_PASSWORD_FILE: /run/secrets/rb5009_password
      MTUNIFI_ROUTEROS_WAN_INTERFACE: ${MTUNIFI_RB5009_WAN1:-ether1}
      MTUNIFI_ROUTEROS_WAN2_INTERFACE: ${MTUNIFI_RB5009_WAN2:-ether5}
      MTUNIFI_ROUTEROS_POLL_INTERVAL: ${MTUNIFI_RB5009_POLL_INTERVAL:-15}
      MTUNIFI_ROUTEROS_TIMEOUT: ${MTUNIFI_RB5009_TIMEOUT:-20}
    volumes:
      - rb5009-gw-state:/state   # holds the adoption private key; do not back up publicly
      - ./examples:/scenarios:ro
    secrets:
      - rb5009_password
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  rb5009-gw-state:
    name: unifi-sim_rb5009-gw-${MTUNIFI_RB5009_MODEL:-UGWXG}-state

secrets:
  rb5009_password:
    file: ./.secrets/rb5009-password
